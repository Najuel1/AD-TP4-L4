<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blobs</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bglight text-dark py-4">
    <h3 class="text-center mb-2">Blobs</h3>

    <section class="container mb-4">
      <div class="d-flex justify-content-center gap-2 mb-3">
        <form>
          <button class="btn btn-primary" id="newBlobBtn" type="button">
            Nuevo Blob
          </button>
          <input id="blobData" type="text" hidden />
          <button class="btn btn-primary" id="downloadBlobBtn" type="button">
            Descargar Blob
          </button>
          <button class="btn btn-primary" id="sliceBlobBtn" type="button">
            Usar Slice()
          </button>
        </form>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
